name: Windows Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config gettext \
            libarchive-dev libcurl4-openssl-dev libgpgme-dev \
            libssl-dev libseccomp-dev bash fakeroot fakechroot \
            nlohmann-json3-dev

      - name: Configure
        run: meson setup build

      - name: Build
        run: meson compile -C build

      - name: Run Windows Backend Pactests
        run: |
          python3 test/pacman/pactest.py \
            --bindir build \
            --ldconfig /sbin/ldconfig \
            --scriptlet-shell /bin/sh \
            test/pacman/tests/windows-upgrade-basic.py \
            test/pacman/tests/windows-upgrade-reinstall.py \
            test/pacman/tests/windows-upgrade-replace.py \
            test/pacman/tests/windows-sync-basic.py \
            test/pacman/tests/windows-query-reason.py \
            test/pacman/tests/windows-query-deps.py \
            test/pacman/tests/windows-remove-recursive.py \
            test/pacman/tests/windows-wrapped-installer.py \
            test/pacman/tests/windows-wrapped-installer-upgrade.py \
            test/pacman/tests/windows-wrapped-installer-modify.py \
            test/pacman/tests/windows-wrapped-installer-fail.py \
            test/pacman/tests/windows-wrapped-remove.py \
            test/pacman/tests/windows-wrapped-remove-fail.py \
            test/pacman/tests/windows-wrapped-remove-registry-residual.py

      - name: Collect Build Artifacts
        if: always()
        run: |
          rm -rf dist
          mkdir -p dist/bin dist/lib dist/scripts

          cp build/pacman dist/bin/
          cp build/pacman-conf dist/bin/
          cp build/vercmp dist/bin/
          cp build/testpkg dist/bin/
          cp build/makepkg dist/bin/
          cp build/pacman-key dist/bin/
          cp build/pacman-db-upgrade dist/bin/
          cp build/repo-add dist/bin/
          cp build/repo-remove dist/bin/
          cp build/repo-elephant dist/bin/
          cp build/libalpm.so.16.0.1 dist/lib/
          cp -a build/scripts/. dist/scripts/

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-backend-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
